[project]
name = "sparsemax-dstl"
version = "0.1.0"
description = "Differentiable signal temporal logic robustness in Warp with MuJoCo Warp and in JAX with MJX, with the SparseMax smoothing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
# the Warp backend: nothing here needs JAX
dependencies = [
    "mujoco~=3.12.0",
    "mujoco-warp==3.12.0",
    "numpy>=2.5.3",
    "warp-lang>=1.17.0",
]

[project.optional-dependencies]
# the JAX backend and the MJX plant; CUDA build of JAX on x86-64 Linux, CPU build elsewhere
jax = [
    "jax[cuda13]>=0.11.2; sys_platform == 'linux' and platform_machine == 'x86_64'",
    "jax>=0.11.2",
    "mujoco-mjx~=3.12.0",
]
# what the notebooks in examples/ use beside the backends
notebooks = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.1",
]

[dependency-groups]
dev = [
    "sparsemax-dstl[jax,notebooks]",
    "pytest>=9.1.1",
    "scipy>=1.18.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sparsemax_dstl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv.sources]
# MuJoCo Warp with reverse-mode derivatives: the adjoint branch of the fork at this URL, pinned by commit
mujoco-warp = { git = "https://github.com/etaoxing/mujoco_warp.git", rev = "357a75d60a56d67d476942a1b6e54b3045ee8e87" }

[tool.uv]
# the fork's own pyproject points mujoco and warp-lang at nightly indexes; keep both on PyPI
no-sources-package = ["mujoco", "warp-lang"]
