[project]
name = "sparsemax-dstl-demos"
version = "0.1.0"
description = "Code of the numerical examples of the SparseMax-dSTL paper: planar unicycle and manipulator beside a person"
requires-python = ">=3.12"
dependencies = [
    "jax==0.11.2",
    "matplotlib==3.11.2",
    "mujoco==3.12.0",
    "mujoco-mjx==3.12.0",
    # listed directly so that [tool.uv.sources] below can replace it with the adjoint fork
    # (uv applies sources to direct dependencies only)
    "mujoco-warp==3.12.0",
    "numpy==2.5.3",
    "optax==0.2.8",
    "scipy==1.18.1",
    "warp-lang==1.17.0",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.uv.sources]
# MuJoCo Warp with reverse-mode derivatives: the adjoint branch of the etaoxing fork, pinned by commit.
mujoco-warp = { git = "https://github.com/etaoxing/mujoco_warp.git", rev = "357a75d60a56d67d476942a1b6e54b3045ee8e87" }

[tool.uv]
# The fork's own pyproject routes mujoco to the py.mujoco.org nightly index and warp-lang to
# pypi.nvidia.com; uv honours a git dependency's sources, so both are ignored here and stay on PyPI.
no-sources-package = ["mujoco", "warp-lang"]
# transitive packages held at the versions of the environment the paper runs used
constraint-dependencies = ["fonttools==4.65.0", "pyparsing==3.3.2", "trimesh==5.1.0"]
